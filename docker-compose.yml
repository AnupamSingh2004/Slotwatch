services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: myapp
    # wal_level=logical is required to enable logical replication (CDC).
    # This is a Postgres startup flag — cannot be set at runtime.
    command: postgres -c wal_level=logical
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: slotwatch-cluster-1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  slotwatch:
    build: .
    environment:
      SLOTWATCH_PG_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./slotwatch.yml.example:/etc/slotwatch/config.yml
    # depends_on with condition: service_healthy waits for the actual service to be ready,
    # not just the container to start. Without this, slotwatch crashes because Postgres
    # takes a few seconds to accept connections after the container starts.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"

  dashboard:
    build: ./dashboard
    environment:
      # Server-side env var — NOT NEXT_PUBLIC_. The dashboard uses Next.js API routes
      # as a proxy so the browser never needs to resolve the docker service name directly.
      SLOTWATCH_API_URL: http://slotwatch:8080
    depends_on:
      - slotwatch
    ports:
      - "3000:3000"
